{{- if and .Values.secret.create .Values.sealedSecret.enabled }}
{{- fail "Enable only one of secret.create and sealedSecret.enabled" }}
{{- end }}
{{- if .Values.secret.create }}
# Plain Secret: base64 is encoding, NOT encryption. For local experiments only.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "microservice.fullname" . }}
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secret.data }}
  {{ $key }}: {{ required (printf "secret.data.%s is empty" $key) $value | quote }}
  {{- end }}
{{- else if .Values.sealedSecret.enabled }}
# SealedSecret: encrypted with the cluster's public key, so it is safe to commit.
# The sealed-secrets controller decrypts it into a normal Secret of the same name.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ include "microservice.fullname" . }}
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
spec:
  encryptedData:
    {{- if not .Values.sealedSecret.encryptedData }}
    {{- fail "sealedSecret.enabled is true but encryptedData is empty. Run: make seal-secrets" }}
    {{- end }}
    {{- toYaml .Values.sealedSecret.encryptedData | nindent 4 }}
  template:
    metadata:
      name: {{ include "microservice.fullname" . }}
      labels:
        {{- include "microservice.labels" . | nindent 8 }}
    type: Opaque
{{- end }}
