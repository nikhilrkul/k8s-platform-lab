{{- if .Values.serviceAccount.create }}
# Each service gets its own identity. Istio turns it into the mTLS certificate
# identity spiffe://cluster.local/ns/<namespace>/sa/<name>, which the
# AuthorizationPolicy matches on.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "microservice.serviceAccountName" . }}
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
