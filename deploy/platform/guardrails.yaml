# LimitRange: defaults for any container that forgets to set resources.
# ResourceQuota: a cap so one namespace can't starve the whole (small) Minikube node.
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: shop-dev
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 50m, memory: 64Mi}
      default: {memory: 256Mi}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: shop-dev
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: shop-prod
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 50m, memory: 64Mi}
      default: {memory: 256Mi}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: shop-prod
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    pods: "20"
