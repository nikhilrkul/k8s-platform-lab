[project]
name = "orders"
version = "0.1.0"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: imports, B: bugbear, S: bandit-style security,
# UP: modern syntax, SIM: simplifications, RUF: ruff-specific, PL: pylint subset
select = ["E", "F", "I", "B", "S", "UP", "SIM", "RUF", "PLE", "PLW"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # asserts and fake passwords are fine in tests

[tool.mypy]
strict = true
python_version = "3.13"
# strict mode turns on --strict-optional: every `x | None` must be handled,
# which is how we catch null-value bugs before they reach a cluster.

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml"

[tool.coverage.run]
relative_files = true

[tool.coverage.report]
# Whole-codebase floor. The stricter >80% rule for *new lines* is enforced
# separately by diff-cover in CI.
fail_under = 80
